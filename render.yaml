services:
  - type: web
    name: telegram-digital-shop
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.main
    numInstances: 1
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: TELEGRAM_ADMIN_IDS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: KHQRPAY_API_KEY
        sync: false
      - key: KHQRPAY_BASE_URL
        value: https://khqrpay.site/api/v1
      - key: KHQRPAY_WEBHOOK_SECRET
        sync: false
      - key: KHQRPAY_WEBHOOK_URL
        sync: false
      - key: STOCK_ENCRYPTION_KEY
        sync: false
      - key: POLL_INTERVAL_SECONDS
        value: "20"
